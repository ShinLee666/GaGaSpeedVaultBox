<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>VaultBox 保险箱</title>
    <script>
      // 主题引导：在 CSS/JS 加载前先按本地偏好设置 html.dark，避免闪烁
      ;(function () {
        try {
          var t = localStorage.getItem('vaultbox:theme')
          if (t === 'dark') document.documentElement.classList.add('dark')
        } catch (e) {
          /* 忽略读取失败 */
        }
      })()
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
